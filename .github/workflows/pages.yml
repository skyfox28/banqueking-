name: Publier l'app et les cours

on:
  push:
    branches: [claude/app-budget, main, master]
  schedule:
    # Toutes les 30 min en semaine pendant les séances de Paris et New York (heure UTC)
    - cron: "*/30 7-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Récupérer les cours
        run: node scripts/fetch-prices.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-*.png prices.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
