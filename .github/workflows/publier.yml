name: Publier l'app et les cours

on:
  push:
    branches: [claude/app-budget, main, master]
  schedule:
    # Toutes les 30 min en semaine pendant les séances de Paris et New York (heure UTC)
    - cron: "*/30 7-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les cours
        run: node scripts/fetch-prices.mjs
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-*.png prices.json _site/
          touch _site/.nojekyll
      - name: Pousser sur la branche gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publication $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
